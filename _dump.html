<!doctype html>
<html><head><meta charset="utf-8"><title>lendo…</title></head>
<body style="font:14px monospace;background:#111;color:#eee;padding:20px">
<pre id="o">lendo…</pre>
<script>
var dump={};
try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); dump[k]=localStorage.getItem(k); } }catch(e){ dump._erro=String(e); }
var quem=(window.navigator.brave?'brave':'chrome');
var alvo='merge-site-'+quem;
var txt='origem: '+location.origin+'\nnavegador: '+quem+'\nchaves: '+Object.keys(dump).length+'\n\n'+JSON.stringify(dump,null,1);
document.getElementById('o').textContent=txt;
fetch('https://parcelamentos-mercado.vercel.app/api/sync',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({key:alvo,data:{quem:quem,origem:location.origin,keys:dump},device:quem})
}).then(function(r){return r.json();}).then(function(j){
  document.title='OK-'+quem;
  document.getElementById('o').textContent='ENVIADO '+quem+'\n'+JSON.stringify(j)+'\n\n'+txt;
}).catch(function(e){
  document.title='ERRO-'+quem;
  document.getElementById('o').textContent='ERRO '+e.message+'\n\n'+txt;
});
</script>
</body></html>
